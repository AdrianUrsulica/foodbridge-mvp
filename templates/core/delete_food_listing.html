{% extends "base.html" %}

{% block title %}Delete Food Listing | FoodBridge{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <h1>Delete Food Listing</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ listing.title }}</strong>?
            This cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-primary btn-danger">
                Yes, delete it
            </button>
        </form>

        <p>
            <a href="{% url 'my_food_listings' %}">
                Cancel
            </a>
        </p>

    </div>
</div>

{% endblock %}
